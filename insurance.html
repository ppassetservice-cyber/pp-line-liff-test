<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>รับข้อเสนอเบี้ยประกัน | PP Asset Service</title><style>*{box-sizing:border-box}body{margin:0;background:#071425;color:#EDF5FF;font:16px Tahoma,sans-serif}main{max-width:560px;margin:40px auto;padding:24px}h1{font-size:24px}p{line-height:1.7}a,button{font:inherit;display:block;width:100%;padding:16px;border:0;border-radius:14px;text-align:center;text-decoration:none;background:#B9FF86;color:#102006} [hidden]{display:none!important}</style></head><body><main><h1>รับข้อเสนอเบี้ยประกัน</h1><p id="status" role="status" aria-live="polite">กำลังส่งรายละเอียดคำขอเข้าแชท PP...</p><a id="chat" href="https://line.me/R/oaMessage/%40pp.asset/" hidden>เปิดแชท PP</a><section id="details" hidden></section><button id="confirm" type="button" hidden>ยืนยันข้อมูลถูกต้อง</button><button id="retry" type="button" hidden>ลองอีกครั้ง</button></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
(function(){'use strict';
var BACKEND='https://script.google.com/macros/s/AKfycbySsRLCbwnj8PTmRTrWor8YZB-7UD32fPWulcbpCLZM95LW6AMpFRci16Pal2AnwHqM/exec';
var ENDPOINT='https://ppassetservice-cyber.github.io/pp-line-liff-test/insurance.html', STORE='pp-insurance-line-ticket-v2';
var status=document.getElementById('status'), retry=document.getElementById('retry'), chat=document.getElementById('chat'), ticket='', waitingForFriend=false, busy=false, frame=null, correlation='', timer=null;
var confirmButton=document.getElementById('confirm'), details=document.getElementById('details'), quote='', confirmationMode=false, confirmStage='review', ready=false;
function parameter(name){var q=new URLSearchParams(location.search),value=q.get(name),state=q.get('liff.state');if(!value && state){try{value=new URL(state,location.origin).searchParams.get(name);}catch(e){}}return value||'';}
confirmationMode=parameter('mode')==='confirm';quote=parameter('quote');
function showDetail(data){details.replaceChildren();var labels={request_id:'เลขที่คำขอ',customer_name:'ชื่อ',customer_phone:'เบอร์โทร',vehicle_make:'ยี่ห้อ',vehicle_model:'รุ่น',vehicle_submodel:'รุ่นย่อย',registration_year:'ปีจดทะเบียน',registration_province:'จังหวัดจดทะเบียน',usage_type:'การใช้งาน',insurance_type:'ประเภทประกัน',preferred_insurers:'บริษัทที่สนใจ'};Object.keys(labels).forEach(function(k){var p=document.createElement('p');p.textContent=labels[k]+': '+(data[k]||'ไม่ระบุ');details.appendChild(p);});details.hidden=false;}
function confirmationResult(result){
 if(!result || !result.ok){confirmButton.hidden=true;fail(result && result.message || 'ยังยืนยันข้อมูลไม่ได้ กรุณาลองอีกครั้ง');return;}
 if(confirmStage==='review'){
   if(!result.detail){fail('ยังโหลดข้อมูลไม่ได้ กรุณาลองอีกครั้ง');return;}
   showDetail(result.detail);ready=true;retry.hidden=true;
   if(result.confirmed && result.acknowledged){status.textContent='คำขอนี้ยืนยันเรียบร้อยแล้ว';chat.hidden=false;return;}
   status.textContent=result.confirmed?'บันทึกการยืนยันแล้ว แต่ยังไม่ได้รับผลสำเร็จของข้อความตอบรับ กดด้านล่างเพื่อลองส่งตอบรับอีกครั้ง':'ตรวจสอบข้อมูลด้านล่าง แล้วกดยืนยันข้อมูลถูกต้อง';
   confirmButton.textContent=result.confirmed?'ลองส่งข้อความตอบรับอีกครั้ง':'ยืนยันข้อมูลถูกต้อง';confirmButton.hidden=false;return;
 }
 if(!result.confirmed){fail('ยังไม่ได้รับผลยืนยัน กรุณาลองอีกครั้ง');return;}
 confirmButton.hidden=true;chat.hidden=false;
 if(result.acknowledged){status.textContent='ยืนยันข้อมูลเรียบร้อยแล้ว และ LINE รับข้อความตอบรับแล้ว';retry.hidden=true;}
 else {status.textContent=result.retry?'บันทึกการยืนยันแล้ว แต่ยังส่งข้อความตอบรับไม่สำเร็จ ลองอีกครั้งได้โดยไม่สร้างคำขอซ้ำ':'บันทึกการยืนยันแล้ว ข้อความตอบรับต้องให้เจ้าหน้าที่ตรวจสอบ กรุณาติดต่อ PP';retry.hidden=!result.retry;retry.textContent='ลองส่งข้อความตอบรับอีกครั้ง';}
}
function submitConfirmation(stage){if(busy || !ready || !/^INS-\d{8}-[A-F0-9]{16}$/.test(quote))return;
 var token=liff.getIDToken();if(!token){ready=false;fail('กรุณาเปิดลิงก์ยืนยันใหม่จากแชท PP');return;}
 busy=true;confirmStage=stage;retry.hidden=true;confirmButton.hidden=true;status.textContent=stage==='review'?'กำลังตรวจสอบบัญชีและข้อมูลคำขอ...':'กำลังบันทึกการยืนยันข้อมูล...';
 if(frame)frame.remove();frame=document.createElement('iframe');var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);correlation=Array.from(bytes).map(function(v){return v.toString(16).padStart(2,'0');}).join('');frame.name='insurance_'+correlation;frame.hidden=true;document.body.appendChild(frame);
 var form=document.createElement('form');form.method='POST';form.action=BACKEND;form.target=frame.name;form.hidden=true;
 var fields={flow:stage==='review'?'insurance-review-liff-v1':'insurance-confirm-liff-v1',quote:quote,idToken:token,format:'bridge',requestId:correlation};if(stage==='confirm')fields.confirmation='yes';
 Object.keys(fields).forEach(function(key){var input=document.createElement('input');input.type='hidden';input.name=key;input.value=fields[key];form.appendChild(input);});document.body.appendChild(form);
 timer=setTimeout(function(){fail('ยังไม่ได้รับผลยืนยัน กรุณาลองอีกครั้งด้วยคำขอเดิม');},30000);form.submit();form.remove();
}
async function initializeConfirmation(){
 if(!/^INS-\d{8}-[A-F0-9]{16}$/.test(quote)){status.textContent='ลิงก์ยืนยันไม่ถูกต้อง กรุณาเปิดจากข้อความรายละเอียดในแชท PP';return;}
 try {var initTimer;try{await Promise.race([liff.init({liffId:'2011333776-7CCq2hRE'}),new Promise(function(_,reject){initTimer=setTimeout(function(){reject(new Error('timeout'));},20000);})]);}finally{clearTimeout(initTimer);}
 if(!liff.isLoggedIn()){liff.login({redirectUri:ENDPOINT+'?mode=confirm&quote='+encodeURIComponent(quote)});return;}
 ready=true;submitConfirmation('review');
 }catch(e){ready=false;fail('ยังตรวจสอบบัญชี LINE ไม่สำเร็จ กรุณาลองอีกครั้ง');}
}
confirmButton.addEventListener('click',function(){submitConfirmation('confirm');});
function valid(v){return /^[a-f0-9]{64}$/.test(v||'');}
function read(){var query=new URLSearchParams(location.search), value=query.get('ticket'), state=query.get('liff.state');
  if(!value && state){try{value=new URL(state,location.origin).searchParams.get('ticket');}catch(e){}}
  if(valid(value)){try{sessionStorage.setItem(STORE,JSON.stringify({ticket:value,until:Date.now()+600000}));}catch(e){}return value;}
  try{var saved=JSON.parse(sessionStorage.getItem(STORE)||'null');if(saved && saved.until>Date.now() && valid(saved.ticket))return saved.ticket;}catch(e){}return '';}
function fail(text){clearTimeout(timer);busy=false;status.textContent=text;retry.hidden=false;}
function openChat(){chat.hidden=false;status.textContent='ส่งรายละเอียดแล้ว กรุณากดยืนยันข้อมูลในแชท PP';
  try{if(liff.isInClient()){liff.openWindow({url:chat.href,external:false});}else{location.replace(chat.href);}}catch(e){/* Keep the direct link if the browser blocks automatic opening. */}}
window.addEventListener('message',function(event){
  if(!frame || !/^https:\/\/[A-Za-z0-9.-]+\.googleusercontent\.com$/.test(event.origin))return;
  var data=event.data;if(!data || data.type!=='pp-insurance-receipt' || data.requestId!==correlation || !busy)return;
  clearTimeout(timer);busy=false;
  if(confirmationMode){confirmationResult(data.result);return;}
  if(data.result && data.result.ok && data.result.receiptStatus==='ACCEPTED'){try{sessionStorage.removeItem(STORE);}catch(e){}openChat();}
  else fail(data.result && data.result.ok?'เชื่อมบัญชีแล้ว แต่ยังส่งรายละเอียดไม่สำเร็จ คำขอของคุณบันทึกแล้ว กรุณาลองอีกครั้ง':'ยังเชื่อม LINE ไม่สำเร็จ กรุณาลองอีกครั้ง หรือติดต่อ PP โดยแจ้งเลขที่คำขอ');
});
function deliver(){if(busy || !ticket)return;var token=liff.getIDToken();if(!token){fail('กรุณาเปิดลิงก์ใหม่จากหน้าแบบฟอร์ม');return;}
 busy=true;retry.hidden=true;status.textContent='กำลังส่งรายละเอียดคำขอเข้าแชท PP...';
 if(frame)frame.remove();frame=document.createElement('iframe');var bytes=new Uint8Array(16);crypto.getRandomValues(bytes);correlation=Array.from(bytes).map(function(v){return v.toString(16).padStart(2,'0');}).join('');frame.name='insurance_'+correlation;frame.hidden=true;document.body.appendChild(frame);
 var form=document.createElement('form');form.method='POST';form.action=BACKEND;form.target=frame.name;form.hidden=true;
 var fields={flow:'insurance-line-link-v1',ticket:ticket,idToken:token,consent:'yes',format:'bridge',requestId:correlation};
 Object.keys(fields).forEach(function(key){var input=document.createElement('input');input.type='hidden';input.name=key;input.value=fields[key];form.appendChild(input);});document.body.appendChild(form);
 timer=setTimeout(function(){fail('ยังไม่ได้รับผลยืนยัน กรุณาลองอีกครั้งด้วยคำขอเดิม');},30000);form.submit();form.remove();
}
async function initialize(){if(confirmationMode){await initializeConfirmation();return;}ticket=read();if(!ticket){status.textContent='ลิงก์คำขอหมดอายุ กรุณากลับไปเปิด LINE จากแบบฟอร์มเดิม ไม่ต้องส่งคำขอซ้ำ';return;}
 try{var initTimer;try{await Promise.race([liff.init({liffId:'2011333776-7CCq2hRE'}),new Promise(function(_,reject){initTimer=setTimeout(function(){reject(new Error('timeout'));},20000);})]);}finally{clearTimeout(initTimer);}ticket=read()||ticket;if(!liff.isLoggedIn()){liff.login({redirectUri:ENDPOINT+'?ticket='+encodeURIComponent(ticket)});return;}
  // A LINE add-friend prompt may still be required by LINE for a new customer.
  var friendship=await liff.getFriendship();if(!friendship.friendFlag){waitingForFriend=true;status.textContent='เพิ่มเพื่อน PP เพื่อรับรายละเอียดและข้อเสนอเบี้ยประกัน';chat.textContent='เพิ่มเพื่อน PP แล้วกลับมารับรายละเอียด';chat.href='https://line.me/R/ti/p/%40pp.asset';chat.hidden=false;retry.textContent='เพิ่มเพื่อนแล้ว รับรายละเอียด';retry.hidden=false;return;}
  waitingForFriend=false;deliver();
 }catch(e){fail('ยังเตรียม LINE ไม่สำเร็จ กรุณาลองอีกครั้ง');}}
document.addEventListener('visibilitychange',function(){if(!document.hidden && waitingForFriend && !busy)initialize();});
retry.addEventListener('click',function(){if(busy)return;if(confirmationMode){if(ready && confirmStage==='confirm')submitConfirmation('confirm');else initializeConfirmation();return;}chat.href='https://line.me/R/oaMessage/%40pp.asset/';chat.textContent='เปิดแชท PP';chat.hidden=true;initialize();});initialize();
}());</script></body></html>
