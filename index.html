<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>เพิ่มเพื่อนไลน์ พีพีแอสเซท</title>
<style>body{margin:0;background:#f4f8fb;color:#0A1545;font-family:system-ui,sans-serif}main{box-sizing:border-box;width:100%;max-width:440px;margin:48px auto;padding:28px;text-align:center}h1{font-size:clamp(20px,6vw,24px);overflow-wrap:anywhere}p{line-height:1.7}button,a{display:inline-block;border:0;border-radius:10px;background:#218F27;color:white;padding:15px 24px;font:inherit;text-decoration:none;cursor:pointer}[hidden]{display:none!important}</style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
<script>
(function(){
  const p=new URL(location.href).searchParams;
  const state=p.get('liff.state')||'';
  let preview=false;
  try{preview=new URL(state,location.origin+location.pathname).pathname.endsWith('/test-mobile.html');}catch(_){}
  if(!preview||!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent))return;
  document.documentElement.classList.add('pp-mobile-preview-entry');
})();
</script>
<style>
html.pp-mobile-preview-entry,html.pp-mobile-preview-entry body{background:#050d17!important}
html.pp-mobile-preview-entry body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;margin:0;padding:14px;box-sizing:border-box}
html.pp-mobile-preview-entry main{display:none!important}
.pp-mobile-entry-wait{display:none}
html.pp-mobile-preview-entry .pp-mobile-entry-wait{display:block;box-sizing:border-box;width:100%;max-width:430px;padding:22px 16px;border:1px solid rgba(156,255,91,.48);border-radius:18px;background:linear-gradient(145deg,rgba(9,30,44,.98),rgba(5,19,34,.98));text-align:center;color:#eaf3ff;font:15px/1.65 system-ui,sans-serif}
.pp-mobile-entry-wait strong{display:block;color:#B9FF86;font-size:18px;font-weight:900}
.pp-mobile-entry-spinner{width:30px;height:30px;border:4px solid rgba(156,255,91,.24);border-top-color:#B9FF86;border-radius:50%;margin:0 auto 13px;animation:ppMobileEntrySpin .8s linear infinite}
@keyframes ppMobileEntrySpin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="pp-mobile-entry-wait" role="status"><div class="pp-mobile-entry-spinner" aria-hidden="true"></div><strong>กำลังเชื่อมต่อ LINE</strong>กรุณารอสักครู่ ระบบกำลังดำเนินการ</div>
<main><h1>เพิ่มเพื่อนไลน์ พีพีแอสเซท</h1>
<p id="status" role="status" aria-live="polite">กำลังเชื่อมต่อ LINE…</p>
<a id="openLine" hidden>เพิ่มเพื่อนไลน์ พีพีแอสเซท</a>
<button id="retry" type="button" hidden>ลองอีกครั้ง</button></main>
<script>
'use strict';
const LIFF_ID='2011333776-W5vn3Aly';
const BACKEND='https://script.google.com/macros/s/AKfycbz1tPDpD1ap5izHhPRhO7wEzc5udW0E-saBnPLB31KpJue0dYF4KgLdlKwVcth8Fh_oHg/exec?mode=liff_receipt_test';
let busy=false;
function pendingTicket() {
  const params=new URL(location.href).searchParams;
  let ticket=params.get('ticket');
  if(!ticket && params.get('liff.state')) {
    ticket=new URL(params.get('liff.state'),location.origin+location.pathname).searchParams.get('ticket');
  }
  try {
    if(ticket && /^[A-Za-z0-9_-]{16,200}$/.test(ticket)) {
      sessionStorage.setItem('pp_liff_pending',JSON.stringify({ticket,time:Date.now()}));
    } else {
      const saved=JSON.parse(sessionStorage.getItem('pp_liff_pending')||'null');
      if(saved && Date.now()-saved.time<600000)ticket=saved.ticket;
    }
  } catch(_) {}
  return ticket;
}
async function connect() {
  if(busy)return;busy=true;
  const status=document.getElementById('status'),retry=document.getElementById('retry');
  retry.hidden=true;
  status.textContent='กำลังตรวจสอบบัญชี LINE เพื่อส่งรายละเอียดลีด…';
  const waiting=setTimeout(()=>{status.textContent='กำลังรอ LINE ตอบกลับ กรุณารอสักครู่…';},6000);
  try {
    if(!window.liff)throw new Error('โหลด LINE ไม่สำเร็จ กรุณาลองอีกครั้ง');
    pendingTicket();
    let deadline;
    try {
      await Promise.race([liff.init({liffId:LIFF_ID,withLoginOnExternalBrowser:false}),new Promise((_,reject)=>{deadline=setTimeout(()=>reject(new Error('LINE ตอบกลับช้า กรุณากดลองอีกครั้ง ไม่ต้องกรอกฟอร์มใหม่')),20000);})]);
    } finally {clearTimeout(deadline);}
    clearTimeout(waiting);
    const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(mobile && !liff.isInClient()) {
      const params=new URL(location.href).searchParams;
      let ticket=params.get('ticket');
      if(!ticket && params.get('liff.state')) {
        ticket=new URL(params.get('liff.state'),'https://ppassetservice-cyber.github.io/pp-line-liff-test/').searchParams.get('ticket');
      }
      if(!ticket || !/^[A-Za-z0-9_-]{16,200}$/.test(ticket))throw new Error('กรุณากลับไปกดเพิ่มเพื่อน LINE จากรายการที่ส่งแล้ว');
      const link=document.getElementById('openLine');
      const url='https://liff.line.me/'+LIFF_ID+'?ticket='+encodeURIComponent(ticket);
      link.href=/Android/i.test(navigator.userAgent)
        ? 'intent://liff.line.me/'+LIFF_ID+'?ticket='+encodeURIComponent(ticket)+'#Intent;scheme=https;package=jp.naver.line.android;S.browser_fallback_url='+encodeURIComponent(location.href)+';end'
        : url;
      link.hidden=false;status.textContent='กดปุ่มด้านล่างเพื่อเปิดแอป LINE และรับรายละเอียดรายการ';
      busy=false;return;
    }
    if(!liff.isLoggedIn()){
      const ticket=pendingTicket();
      if(!ticket || !/^[A-Za-z0-9_-]{16,200}$/.test(ticket))throw new Error('กรุณากลับไปกดเพิ่มเพื่อน LINE จากรายการที่ส่งแล้ว');
      liff.login({redirectUri:location.origin+location.pathname+'?ticket='+encodeURIComponent(ticket)});return;
    }
    if(!liff.isLoggedIn())return;
    // LIFF handles its redirects before reading the final ticket.
    const ticket=pendingTicket();
    const idToken=liff.getIDToken();
    if(!ticket || !/^[A-Za-z0-9_-]{16,200}$/.test(ticket))throw new Error('กรุณากลับไปกดเพิ่มเพื่อน LINE จากรายการที่ส่งแล้ว');
    if(!idToken)throw new Error('ยืนยันบัญชี LINE ไม่สำเร็จ กรุณาลองอีกครั้ง');
    status.textContent='กำลังส่งรายละเอียดรายการให้คุณ…';
    // Top-level POST avoids cross-origin AJAX and never puts the ID token in a URL.
    const form=document.createElement('form');
    form.method='POST';form.action=BACKEND;form.target='_self';form.hidden=true;
    for(const [name,value] of Object.entries({ticket,idToken,format:'html'})) {
      const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input);
    }
    document.body.appendChild(form);form.submit();
  } catch(error) {
    clearTimeout(waiting);
    status.textContent=error instanceof Error?error.message:'เชื่อมต่อไม่สำเร็จ กรุณาลองอีกครั้ง';retry.hidden=false;busy=false;
  }
}
document.getElementById('retry').addEventListener('click',()=>location.reload());
window.addEventListener('DOMContentLoaded',connect);
</script>
</body>
</html>
